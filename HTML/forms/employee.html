<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Empolyee</title>
</head>

<body>
    <table>
        <fieldset>
            <legend>
                <h2>Employee Form</h2>
            </legend>
            <h3>1. Personal Details</h3>
            <label>Employee Name :</label>
            <input type="text" placholder="Enter your Employee Name"><br><br>

            <label>Father Name :</label>
            <input type="text" placeholder="Enter your Father Name"><br><br>

            <label>Date Of Brith :</label>
            <input type="date" placeholder="Selecct date"><br>

            <lable>
                <h3>Gender :</h3>
            </lable>
            <input type="radio">Male
            <input type="radio">Female
            <input type="radio">Other<br>
            <label></label>

            <h3>2. Contact Details</h3>

            <label>Phone Number :</label>
            <input type="tel"><br><br>

            <label>Email Id :</label>
            <input type="email" placeholder="Enter your Mail Id"><br><br>

            <label>Address :</label>
            <textarea name=""></textarea><br><br>

            <h3>3.Job Details</h3>

            <label>Employee ID:</label>
            <input type="text" placeholder="Enter you Employee ID"><br><br>

            <label>Department :</label>
            <select>
                <option>Select</option>
                <option>HR</option>
                <option>IT</option>
                <option>Finance</option>
                <option>Marketing</option>
                <option>Sales</option>
            </select><br><br>

            <label>Designation :</label>
            <input type="text" placeholder="Enter designation"><br><br>

            <lable>Date of Joining :</lable>
            <input type="date" placeholder="Select date"><br>

            <label><h4>Employment Type :</h4></label>
            <input type="radio">Full Time<br>
            <input type="radio">PartTime<br>
            <input type="radio">Inntership<br>

           <h3>4. Other Details :</h3>

           <label>Salary (Per Month) :</label>
            <input Enter Salary><br><br>

            <label>Upload Photograph :</label>
            <input type="file" placeholder="Photo file name (example:photo.jpg)"><br><br>
          
            <input type="radio">I confirm that the above detalis are correct.<br><br>
            <button>Submit</button>

        </fieldset>

    </table>
</body>

</html>
