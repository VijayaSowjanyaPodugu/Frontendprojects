<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>grid child properties task 2</title>
</head>
<style>
    main {
        height: 500px;
        width: 500px;
        border: 2px solid black;
        display: grid;
        grid-template-columns: repeat(6, 1fr);
        grid-template-rows: repeat(6, 1fr);
    }

    article {
        border: 2px solid white;
        display: flex;
        /* align-items: center;
        justify-content: center; */
        font-size: 50px;
        color: white;
        background-color: yellowgreen;
        display: grid;
    }

    #article1 {

        grid-column: 1/7;
    }

    #article2 {
        grid-area: 2/1/6/5;
    }

    #article3 {
        grid-area: 6/1/7/5;
    }

    #article4 {
        grid-row:2/7;
        
    }

    #article5 {
        grid-row:2/7;
    }
</style>

<body>
    <main>
        <article id="article1">1</article>
        <article id="article2">2</article>
        <article id="article3">3</article>
        <article id="article4">4</article>
        <article id="article5">5</article>
    </main>
</body>

</html>
