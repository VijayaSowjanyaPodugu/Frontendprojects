<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    article {
        border: solid;
        color: white;
        font-size: 50px;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .one {
        display: grid;
        grid-template-columns: 1fr;
    }

   
    .one2 {
        display: grid;
        grid-template-columns: repeat(2 ,1fr);
    }

    .one3 {
        display: grid;
        grid-template-columns:repeat(3 ,1fr);
    }
     .one4 {
        display: grid;
        grid-template-columns:repeat(4 ,1fr);
    }
     .one5{
        display: grid;
        grid-template-columns:repeat(6,1fr);
    }
     .one12 {
        display: grid;
        grid-template-columns:repeat(12,1fr);
    }
</style>

<body>
    <main>
        <div class="one">
            <article style="background-color:green">1</article>
        </div>

        <div class="one2">
            <article style="background-color:green">2</article>
            <article style="background-color:green">3</article>
        </div>

        <div class="one3">
            <article style="background-color:green">4</article>
            <article style="background-color:green">5</article>
            <article style="background-color:green">6</article>
        </div>

        <div class="one4">
            <article style="background-color:green">7</article>
            <article style="background-color:green">8</article>
            <article style="background-color:green">9</article>
            <article style="background-color:green">10</article>
        </div>

        <div class="one5">
            <article style="background-color:green">11</article>
            <article style="background-color:green">12</article>
            <article style="background-color:green">13</article>
            <article style="background-color:green">14</article>
            <article style="background-color:green">15</article>
            <article style="background-color:green">16</article>
        </div>


        <div class="one12">
            <article style="background-color:green">17</article>
            <article style="background-color:green">18</article>
            <article style="background-color:green">19</article>
            <article style="background-color:green">20</article>
            <article style="background-color:green">21</article>
            <article style="background-color:green">22</article>
            <article style="background-color:green">23</article>
            <article style="background-color:green">24</article>
            <article style="background-color:green">25</article>
            <article style="background-color:green">26</article>
            <article style="background-color:green">27</article>
            <article style="background-color:green">28</article>
        </div>


       
    </main>
</body>

</html>
