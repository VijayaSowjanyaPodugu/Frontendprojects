    /* flex properites */
    nav {
        height: 70px;
        display: flex;
        border-bottom: 1px solid gray;

    }

    section {
        display: flex;
        align-items: center;
        justify-content: center;
    }

    #logo {
        flex-grow: 1;
        /* flex-basis: 15%; */
    }

    #navigation {
        flex-grow: 3;
        /* flex-direction: 65%; */
    }

    #profile {
        flex-grow: 2;
        /* flex-basis: 20%; */
    }
    ul{
        display: flex;
        justify-content: space-evenly;
        width:90%;
        list-style: none;
    }
    a{
        text-decoration: none;
        color:black;
        font-size:20px;
        font-weight: 500px;

    }
</style>
