<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Linkend</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    main {
        font-family: serif;
    }

    nav {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 160px;
        padding: 20px;

    }

    section {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 20px;
    }

    #s1 {
        font-size: 25px;
        font-weight: 600;
        color: blue;
        flex-grow: 8;
    }

    #s2 {
        flex-grow: 5;
        gap: 50px;

    }

    #s2 a{
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    #s1 p {
        color: white;
        background-color: blue;
    }

    a {
        text-decoration: none;
        font-size: 20px;
        font-weight: 200;
        color: black;
    }

    .a1 {
        border: 1px solid blue;
        color: blue;
        height: 40px;
        width: 90px;
        border-radius: 20px;
        padding-top: 7px;
        padding-left: 10px;
    }

    .a2 {
        border: 1px solid blue;
        color: white;
        background-color: blue;
        height: 40px;
        width: 90px;
        border-radius: 20px;
        padding-left: 15px;
        padding-top: 7px;
    }

    #aside {
        display: flex;
        gap: 100px;
    }

    #article1 {
        margin-left: 30px;
        margin-top: 100px;
        padding: 20px;
        text-align: center;
        line-height: 70px;

    }

    #article1 span {
        font-size: 50px;
        font-weight: 500px
    }

    #article1 button {
        width: 80%;
        height: 50px;
        border-radius: 30px;
        font-size: 17px;
    }

    .b1 {
        background-color: blue;
        color: white;
    }

    small {
        color: blue;
        font-size: 16px;
        font-weight: bold;
    }

    #s2 i {
        text-align: center;
        font-size: 20px;
    }
</style>

<body>
    <main>
        <nav>
            <section id="s1">Linked<p>in</p>
            </section>

            <section id="s2">

                <a href="">
                    <i class="fa-solid fa-rocket"></i>
                    <span>Top Content</span>
                </a>

                <a href="">
                    <i class="fa-solid fa-people-group"></i>
                    <span>People</span>
                </a>

                <a href="">
                    <i class="fa-solid fa-graduation-cap"></i>
                    <span>Learning</span>
                </a>

                <a href="">
                    <i class="fa-solid fa-briefcase"></i><br>
                    <span>Jobs</span>
                </a>

                <a href="">
                    <i class="fa-solid fa-puzzle-piece"></i>
                    <span> Games</span>
                </a>
                
                <a class="a1" href="">Join now</a>
                <a class="a2" href="">Sign In</a>
            </section>
        </nav>
        <aside id="aside">
            <article id="article1">
                <span>Welcome to your </span><br>
                <span>Professional community</span><br>
                <button class="b1">Continue with Google</button><br>
                <button class="b2">Sign in with Microsoft</button><br>
                <button class="b2">Sign in with email</button><br>
                <p>By continuing,you agree to LinkendIn's <small> User Agreement </small> and <small> Cookies
                        Policy</small></p>
                <p>New to linkedIn?<small>Join now</small></p>
            </article>
            <article>
                <img src="https://static.licdn.com/aero-v1/sc/h/dxf91zhqd2z6b0bwg85ktm5s4" alt="" width="700px"
                    height="700px">
            </article>
        </aside>
    </main>
</body>

</html>
