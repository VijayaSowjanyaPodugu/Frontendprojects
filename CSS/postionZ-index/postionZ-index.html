<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Z- index</title>
</head>

<style>
    main,
    section,
    aside {
        width: 50px;
        height: 60px;
        border: solid;
    }

    main {
        background-color: red;
        position: absolute;
        z-index: 1;



    }

    section {
        background-color: green;
        position: absolute;
        z-index: 2;
        left: 20px;
    }

    aside {
        background-color: blue;
        position: absolute;
        z-index: 3;
        left: 50px;
    }
</style>

<body>
    <main></main>
    <section></section>
    <aside></aside>
</body>

</html>
