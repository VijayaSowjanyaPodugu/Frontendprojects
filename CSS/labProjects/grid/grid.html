<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Explorer -CSS grid </title>
</head>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    nav {
        display: flex;
        height: 70px;
        align-items: center;
        background-color: black;
    }

    ul {
        display: flex;
        justify-content: space-evenly;
        align-items: center;
        width: 90%;
    }

    .header {
        flex-grow: 2;
        font-size: 20px;
        color: white;
        margin-left: 20px;

    }

    .navigation {
        flex-grow: 1;
    }

    .navigation a {
        text-decoration: none;
        color: white;
        font-size: 20px;
    }

    button {
        padding: 10px;
        width: 90px;
        border-radius: 10px;
        background-color: white;
    }

    .tittle {
        background-color: blue;
        color: white;
        text-align: center;
     
        padding: 20px;
    }

    .tittle h1{
        margin-bottom: 10px;
    }

    .tittle p{
        margin-bottom: 10px;
    }

    .photos {
        padding: 10px;
        margin-top: 20px;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        grid-template-rows: repeat(3, 100px);
        gap: 20px;

    }

    .photos div{
        border: 2px solid black;
        border-radius: 10px;
        background-image: url("https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR7Ss9Y69trDejUc2Gmy1jTbOJYNA-Of_5OO-GEk4SbngmQtqDgjj38eq4&s=10");
        background-position: center;
        background-repeat: no-repeat;
        background-size: cover;
        position: relative;

    }

    .photos div span
    {
        position: absolute;
        bottom: 10px;
        left: 10px;
        font-size: 20px;
        font-weight: bold;
        color: white;
    }

    .paris
    {
        grid-column: 1/3;
    }
    .Tokyo
    {
        grid-row: 2/4;
    }

    .switzerland
    {
        grid-column: 3/5;
    }
    footer{
        background-color: black;
        text-align: center;
        color:white;
        font-size: 20px;
        padding:10px;
    }
</style>

<body>
    <main>
        <nav>
            <section class="header">
                <h1>TravelX</h1>
            </section>
            <section class="navigation">
                <ul>
                    <li> <a href="">Home</a></li>
                    <li> <a href="">Destination</a></li>
                    <li> <a href="">Packages</a></li>
                    <li> <a href="">Contact</a></li>
                </ul>
            </section>
        </nav>
        <section class="tittle">
            <h1>Explore The world 🌍</h1>
            <p>Discover amazing destination and create unforgrttable memories.</p>
            <button>Book Now</button>
        </section>



        <div class="photos">
            <div class="paris"><span>Paris</span></div>
            <div class="Dubai"><span>Dubai</span></div>
            <div><span>London</span></div>
            <div class="Tokyo"><span>Tokyo</span></div>
            <div><span>Singapore</span></div>
            <div ><span>Maldivs</span></div>
            <div class="switzerland"><span>switzerland</span></div>
       
        </div>

        <footer>
            <section>&copy; 2026 TravelX</section>
        </footer>

    </main>
</body>

</html>
