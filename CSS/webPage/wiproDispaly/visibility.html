<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visibility</title>
</head>
<style>
    body{
        background-color: aliceblue;
    }
    .navbar{
        margin-top: 170px;
    
    }
    .navbar a{
        text-decoration: none;
        display: flex;
        padding:10px;
        font-size: 20px;
        gap:15px; 
    }
    span{
        visibility: hidden;
    }
    .navbar:hover span{
        visibility: visible;
    }
    
</style>
