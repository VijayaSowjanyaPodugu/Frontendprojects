<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Burger</title>
</head>
<style>
    body {
        background-color: black;
    }

    .poster {
        border: 2px solid orange;
        width: 90%;
        height: 600px;
        margin: auto;
        margin-top: 70px;
        background: radial-gradient(circle, rgb(237, 180, 74), rgb(219, 221, 69), orange);
        position: relative;

    }

    .burger {
        position: absolute;
        margin-left: 500px;
        padding-top: 160px;
        z-index: 3;

    }

    .coke {
        position: absolute;
        z-index: 2;
        right: 380px;
        top: 40px;

    }

    .fries {
        position: absolute;
        z-index: 1;
        top: 80px;
        left: 350px
    }

    .fixed {
        position: fixed;
        height: 170px;
        width: 170px;
        bottom: 43px;
        left: 490px;
        background-color: red;
        border: 2px solid red;
        border-radius: 100%;
        z-index: 4;
        text-align: center;
        color:white;
       
    }
    .fixed p{
       
        font-size: 30px;
     
       
    }
   
    .innerCircle{
        position: fixed;
        border: 2px dashed white;
        height: 140px;
        width:140px;
        border-radius:100%;
        bottom: 58px;
        left: 508px;
       
    }
</style>

<body>

    <div class="poster">
        <div class="images burger">
            <img src="./asset/Burger/Burger-removebg-preview.png" alt="Burger">
        </div>
        <div class="images coke">
            <img src="./asset/Burger/coke-removebg-preview.png" alt="coke">
        </div>
        <div class="images fries">
            <img src="./asset/Burger/fries-removebg-preview.png" alt="fries">
        </div>

        <div class="fixed">
            <div class="innerCircle">
            <p>$5.49<br>ONLY</p>
            </div>
            
        </div>
    </div>

</body>

</html>
